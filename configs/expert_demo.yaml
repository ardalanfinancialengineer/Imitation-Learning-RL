# Weeks 9-13 rolling-horizon Markowitz expert demonstration.
# Uses the same canonical three-regime preset as the Weeks 5-8 simulation so
# expert results are directly comparable with the simulation report.

simulation:
  preset: canonical_three_regime
  n_assets: 8
  T: 2500
  seed: 42

expert:
  horizon: 21               # H = 21 trading days, as specified in the exposé
  # Gamma multiplies the variance term of Equation (5). It is scale-invariant:
  # annualising mu and Sigma scales both by 252, so mu/sigma^2 is unchanged.
  # On this preset the oracle optimum coincides with equal weight at gamma ~ 2
  # (see docs/markowitz_expert.md); 5 is a mildly risk-averse benchmark.
  risk_aversion: 5.0
  transaction_cost: 0.0025  # Headline c; must lie in [0.001, 0.005]
  constraints:
    long_only: true
    min_weight: 0.0         # l_i
    max_weight: 0.30        # u_i
    leverage_limit: 1.0     # L; redundant while long-only and fully invested
  moments:
    estimator: regime_mixture   # regime_mixture | rolling
    covariance: ledoit_wolf     # sample | ledoit_wolf
    window: 60                  # Rolling window, also the blend window
    blend_weight: 0.25          # Weight on rolling moments inside the mixture
    n_regimes: 3
    burn_in: 500                # First date at which the HMM can be fitted
    refit_every: 250            # Baum-Welch refit cadence

# Ablations reported by the demo. Each entry re-runs the expert changing only
# the named parameter, which is what makes the comparison interpretable.
ablations:
  transaction_costs: [0.0, 0.001, 0.0025, 0.005]
  horizons: [1, 5, 21]
  risk_aversions: [2.0, 5.0, 20.0]
  covariance_estimators: [sample, ledoit_wolf]

diagnostics:
  max_constraint_violation: 1.0e-6
  max_fallback_rate: 0.0
  max_replication_error: 1.0e-9   # Warm starting is off, so replays are exact
  max_determinism_error: 1.0e-9
  min_turnover_reduction: 1.0e-4
  max_median_solve_seconds: 0.5
  min_regime_filter_accuracy: 0.45

paths:
  output_dir: data/expert_demo/
